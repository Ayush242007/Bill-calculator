<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quick Bill Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    :root {
        --bg-color: #0f1115;
        --app-bg: #181b21;
        --primary: #d4af37; 
        --primary-hover: #b5952f;
        --text-main: #f5f5f7;
        --text-muted: #86868b;
        --surface: #22262f;
        --surface-hover: #2a2f3a;
        --danger: #ff453a;
        --success: #32d74b;
        --info: #0a84ff;
    }

    * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        justify-content: center;
        touch-action: manipulation; 
    }
    
    .app-container {
        width: 100%;
        max-width: 400px;
        background-color: var(--app-bg);
        height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 15px;
        background-color: rgba(24, 27, 33, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        z-index: 10;
    }
    .header h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
    
    .btn-small {
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        color: white;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s ease;
        margin-left: 5px;
    }
    .btn-small:active { transform: scale(0.95); opacity: 0.8; }
    .btn-clear { background-color: rgba(255, 69, 58, 0.15); color: var(--danger); }
    .btn-history { background-color: rgba(10, 132, 255, 0.15); color: var(--info); } 
    .btn-thermal { background-color: var(--primary); color: #000; font-size: 14px; padding: 12px; width: 100%; margin-bottom: 10px; border-radius: 12px; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);}
    .btn-a4 { background-color: var(--success); color: white; font-size: 14px; padding: 12px; width: 100%; border-radius: 12px;}
    .btn-ok { background-color: var(--primary); color: black; font-size: 14px; padding: 10px 25px; border:none; border-radius: 8px; font-weight: 600; cursor:pointer;}

    .table-header {
        display: flex;
        background-color: var(--surface);
        padding: 12px 5px;
        font-weight: 600;
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .table-header div { flex: 1; text-align: center; }
    
    .bill-list {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
        font-size: 14px;
        touch-action: pan-y; 
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .bill-item {
        display: flex;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        animation: fadeIn 0.3s ease-out;
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 8px;
        margin-bottom: 2px;
    }
    .bill-item:active { background-color: var(--surface); }
    .bill-item div { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500;}
    .bill-item.editing { background-color: var(--surface); border-left: 3px solid var(--primary); }

    .total-bar {
        background-color: rgba(34, 38, 47, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        font-weight: 700;
        border-top: 1px solid rgba(255,255,255,0.05);
        color: var(--primary);
    }
    
    .input-section {
        padding: 15px 15px 5px 15px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    
    .item-name-row {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .item-name-input {
        flex: 1;
        background-color: var(--surface);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 14px 15px;
        font-size: 15px; 
        color: var(--text-main);
        outline: none;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .item-name-input:focus { border-color: var(--primary); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 1px var(--primary); }
    .item-name-input::placeholder { color: var(--text-muted); text-align: left; font-weight: 400;}

    .price-qty-row {
        display: flex;
        gap: 12px;
    }
    .input-box {
        flex: 1;
        background-color: var(--surface);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 15px 15px;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-main);
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
    }
    .input-box.active { border-color: var(--primary); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 1px var(--primary); }
    .placeholder { color: var(--text-muted); font-size: 14px; font-weight: 400; }

    .numpad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        padding: 15px 20px 25px 20px;
        background-color: var(--app-bg);
        touch-action: none; 
    }
    
    .num-btn {
        background-color: var(--surface);
        color: var(--text-main);
        border: none;
        border-radius: 16px;
        width: 100%;
        height: 65px;
        font-size: 24px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.1s ease;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .num-btn:active { background-color: var(--surface-hover); transform: scale(0.92); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    
    .action-btn {
        background-color: var(--primary);
        color: black;
        border: none;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: all 0.1s ease;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }
    .action-btn:active { transform: scale(0.92); box-shadow: 0 1px 2px rgba(212, 175, 55, 0.15); }
    .action-btn.save { border-radius: 16px; width: 100%; height: 65px; }
    .action-btn.enter { grid-column: 4; grid-row: 2 / span 3; height: 100%; width: 100%; border-radius: 24px; }
    .btn-delete { background-color: rgba(255, 69, 58, 0.1); color: var(--danger); font-size: 22px; box-shadow: none; }

    .modal {
        display: none;
        position: fixed;
        z-index: 100;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.6);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
    }
    .modal-content {
        background-color: var(--app-bg);
        width: 90%;
        max-width: 350px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        max-height: 85vh;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .modal-header h3 { margin: 0; color: var(--primary); font-weight: 600; font-size: 18px;}
    .close { color: var(--text-muted); font-size: 24px; font-weight: bold; cursor: pointer; line-height: 1; transition: color 0.2s;}
    .close:hover { color: white; }
    
    .history-list { 
        padding: 15px; 
        overflow-y: auto; 
        touch-action: pan-y; 
    }
    
    .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background-color: var(--surface);
        border-radius: 12px;
        margin-bottom: 10px;
        border: 1px solid rgba(255,255,255,0.02);
    }
    .hist-info { flex: 1; cursor: pointer; }
    .hist-info strong { font-size: 15px; color: var(--text-main); font-weight: 600;}
    .hist-info small { color: var(--text-muted); display: block; margin-top: 6px; font-size: 12px;}
    .hist-actions { display: flex; gap: 8px; }
</style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>Quick Bill</h2>
        <div>
            <button class="btn-small btn-history" onclick="openHistory()">History</button>
            <button class="btn-small btn-clear" onclick="requestClearBill()">Clear</button>
        </div>
    </div>

    <div class="table-header">
        <div>SR</div>
        <div>DETAILS</div>
        <div>PRICE</div>
        <div>QTY</div>
        <div>TOTAL</div>
    </div>

    <div class="bill-list" id="billList">
        <div style="text-align: center; padding: 20px; color: #666; font-size: 12px;" id="emptyText">
            Items will appear here. <br>Tap on any item to edit it.
        </div>
    </div>

    <div class="total-bar">
        <span>Total:</span>
        <span id="grandTotal">₹0</span>
    </div>

    <div class="input-section">
        <div class="item-name-row">
            <input type="text" class="item-name-input" id="itemNameInput" placeholder="Enter Item Name (Optional)">
            <button id="deleteItemBtn" class="btn-small btn-clear" style="display: none; padding: 0 15px; font-size: 16px; margin: 0;" onclick="deleteCurrentItem()" title="Delete Item">🗑️</button>
        </div>
        <div class="price-qty-row">
            <div class="input-box active" id="priceBox" onclick="setActive('price')">
                <span class="placeholder" id="pricePlaceholder">Price</span>
                <span id="priceValue"></span>
            </div>
            <div class="input-box" id="qtyBox" onclick="setActive('qty')">
                <span class="placeholder" id="qtyPlaceholder">Qty</span>
                <span id="qtyValue"></span>
            </div>
        </div>
    </div>

    <div class="numpad">
        <button class="num-btn" onclick="addNumber('7')">7</button>
        <button class="num-btn" onclick="addNumber('8')">8</button>
        <button class="num-btn" onclick="addNumber('9')">9</button>
        <button class="action-btn save" onclick="openSaveModal()">Save</button>

        <button class="num-btn" onclick="addNumber('4')">4</button>
        <button class="num-btn" onclick="addNumber('5')">5</button>
        <button class="num-btn" onclick="addNumber('6')">6</button>
        <button class="action-btn enter" onclick="handleEnter()">Enter<br>X</button>

        <button class="num-btn" onclick="addNumber('1')">1</button>
        <button class="num-btn" onclick="addNumber('2')">2</button>
        <button class="num-btn" onclick="addNumber('3')">3</button>

        <button class="num-btn" onclick="addNumber('.')">.</button>
        <button class="num-btn" onclick="addNumber('0')">0</button>
        <button class="num-btn btn-delete" id="backspaceBtn">⌫</button>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Saved Invoices</h3>
                <span class="close" onclick="closeHistory()">&times;</span>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <!-- Custom Save Modal -->
    <div id="saveModal" class="modal">
        <div class="modal-content" style="padding: 20px;">
            <h3 style="margin-top:0; color:var(--primary);">Save & Print Invoice</h3>
            
            <p style="color:var(--text-muted); font-size:14px; margin-bottom:5px;">Customer Name:</p>
            <!-- Changed default text. Blank triggers Auto name -->
            <input type="text" id="modalCustomerName" class="item-name-input" placeholder="Leave blank for auto name" style="margin-bottom:15px; width: 100%;">

            <p style="color:var(--text-muted); font-size:14px; margin-bottom:5px;">Amount Left to Pay (₹):</p>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <!-- Amount left input -->
                <input type="number" id="modalBalanceLeft" class="item-name-input" placeholder="0" style="flex: 1; min-width: 0;">
                <!-- Auto set full payment to 0 balance -->
                <button class="btn-small btn-a4" style="width: auto; padding: 10px 15px; background-color: var(--success);" onclick="setFullPaid()">Fully Paid</button>
            </div>

            <p style="color:var(--text-muted); font-size:14px; margin-bottom:10px;">Select Print Format:</p>
            <div>
                <button class="btn-small btn-thermal" onclick="executeSave(true)">🖨️ 2-Inch Thermal Receipt</button>
                <button class="btn-small btn-a4" onclick="executeSave(false)">📄 Standard A4 PDF</button>
            </div>
            
            <div style="text-align:right; margin-top:20px;">
                <button class="btn-small btn-clear" style="padding:8px 15px;" onclick="closeSaveModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="alertModal" class="modal">
        <div class="modal-content" style="padding: 20px; text-align: center;">
            <h3 style="margin-top:0; color:var(--primary);">Notice</h3>
            <p id="alertMessage" style="color:white; margin: 20px 0; font-size: 16px;"></p>
            <button class="btn-ok" onclick="closeAlertModal()">OK</button>
        </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content" style="padding: 20px; text-align: center;">
            <h3 style="margin-top:0; color:var(--primary);">Confirm Action</h3>
            <p id="confirmMessage" style="color:white; margin: 20px 0; font-size: 16px;"></p>
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button class="btn-small btn-clear" style="padding: 10px 20px;" onclick="closeConfirmModal()">Cancel</button>
                <button class="btn-ok" style="padding: 10px 25px;" onclick="executeConfirm()">Yes</button>
            </div>
        </div>
    </div>

</div>

<script>
    // --- Satisfying Audio Generator ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
    }

    function playClickSound() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.05);
    }

    document.body.addEventListener('pointerdown', function(e) {
        const target = e.target.closest('button, .input-box, .bill-item, .hist-info, .close');
        if (target) {
            initAudio(); 
            playClickSound();
        }
    });

    document.addEventListener('dblclick', function(event) {
        event.preventDefault();
    }, { passive: false });


    let activeField = 'price'; 
    let priceInput = '';
    let qtyInput = '';
    let grandTotal = 0;
    let billItemsData = [];
    let editingIndex = -1; 
    let invoiceHistory = JSON.parse(localStorage.getItem('quickBillHistory')) || [];
    let confirmCallback = null;

    const priceBox = document.getElementById('priceBox');
    const qtyBox = document.getElementById('qtyBox');
    const priceValue = document.getElementById('priceValue');
    const qtyValue = document.getElementById('qtyValue');
    const pricePlaceholder = document.getElementById('pricePlaceholder');
    const qtyPlaceholder = document.getElementById('qtyPlaceholder');
    const billList = document.getElementById('billList');
    const grandTotalDisplay = document.getElementById('grandTotal');
    const itemNameInput = document.getElementById('itemNameInput');
    const deleteItemBtn = document.getElementById('deleteItemBtn');
    const backspaceBtn = document.getElementById('backspaceBtn');
    
    // --- Hold to Delete Logic ---
    let deleteInterval;
    let deleteTimeout;

    function startDelete(e) {
        if (e.type === 'touchstart') e.preventDefault(); 
        backspace(); 
        deleteTimeout = setTimeout(() => {
            deleteInterval = setInterval(() => {
                backspace();
                playClickSound(); 
            }, 100); 
        }, 400); 
    }

    function stopDelete() {
        clearTimeout(deleteTimeout);
        clearInterval(deleteInterval);
    }

    backspaceBtn.addEventListener('mousedown', startDelete);
    backspaceBtn.addEventListener('touchstart', startDelete, {passive: false});
    backspaceBtn.addEventListener('mouseup', stopDelete);
    backspaceBtn.addEventListener('mouseleave', stopDelete);
    backspaceBtn.addEventListener('touchend', stopDelete);
    backspaceBtn.addEventListener('touchcancel', stopDelete);

    // --- Custom Alert & Confirm Functions ---
    function customAlert(message) {
        document.getElementById('alertMessage').innerText = message;
        document.getElementById('alertModal').style.display = 'flex';
    }
    function closeAlertModal() { document.getElementById('alertModal').style.display = 'none'; }
    
    function customConfirm(message, callback) {
        document.getElementById('confirmMessage').innerText = message;
        confirmCallback = callback;
        document.getElementById('confirmModal').style.display = 'flex';
    }
    function closeConfirmModal() {
        document.getElementById('confirmModal').style.display = 'none';
        confirmCallback = null;
    }
    function executeConfirm() {
        let tempCallback = confirmCallback; 
        closeConfirmModal(); 
        if(tempCallback) tempCallback(); 
    }

    // --- Calculator Logic ---
    function setActive(field) {
        activeField = field;
        if (field === 'price') {
            priceBox.classList.add('active');
            qtyBox.classList.remove('active');
        } else {
            qtyBox.classList.add('active');
            priceBox.classList.remove('active');
        }
    }

    function addNumber(num) {
        if (activeField === 'price') {
            if (num === '.' && priceInput.includes('.')) return;
            priceInput += num;
            priceValue.textContent = priceInput;
            pricePlaceholder.style.display = 'none';
        } else {
            if (num === '.' && qtyInput.includes('.')) return;
            qtyInput += num;
            qtyValue.textContent = qtyInput;
            qtyPlaceholder.style.display = 'none';
        }
    }

    function backspace() {
        if (activeField === 'price' && priceInput.length > 0) {
            priceInput = priceInput.slice(0, -1);
            priceValue.textContent = priceInput;
            if (priceInput.length === 0) pricePlaceholder.style.display = 'inline';
        } else if (activeField === 'qty' && qtyInput.length > 0) {
            qtyInput = qtyInput.slice(0, -1);
            qtyValue.textContent = qtyInput;
            if (qtyInput.length === 0) qtyPlaceholder.style.display = 'inline';
        }
    }

    function handleEnter() {
        if (!priceInput || isNaN(priceInput)) {
            customAlert("Please enter a valid price.");
            return;
        }
        
        let p = parseFloat(priceInput);
        let q = qtyInput ? parseFloat(qtyInput) : 1; 
        let total = p * q;
        let name = itemNameInput.value.trim() || `Item ${billItemsData.length + 1}`;

        if (editingIndex >= 0) {
            billItemsData[editingIndex] = { name, price: p, qty: q, total };
            editingIndex = -1;
            deleteItemBtn.style.display = 'none';
        } else {
            billItemsData.push({ name, price: p, qty: q, total });
        }

        resetInputs();
        updateUI();
    }

    function resetInputs() {
        priceInput = '';
        qtyInput = '';
        itemNameInput.value = '';
        priceValue.textContent = '';
        qtyValue.textContent = '';
        pricePlaceholder.style.display = 'inline';
        qtyPlaceholder.style.display = 'inline';
        setActive('price');
        editingIndex = -1;
        deleteItemBtn.style.display = 'none';
    }

    function editItem(index) {
        editingIndex = index;
        let item = billItemsData[index];
        itemNameInput.value = item.name.startsWith('Item ') ? '' : item.name;
        priceInput = item.price.toString();
        qtyInput = item.qty.toString();
        
        priceValue.textContent = priceInput;
        qtyValue.textContent = qtyInput;
        pricePlaceholder.style.display = 'none';
        qtyPlaceholder.style.display = 'none';
        
        deleteItemBtn.style.display = 'block';
        setActive('price');
    }

    function deleteCurrentItem() {
        if (editingIndex >= 0) {
            billItemsData.splice(editingIndex, 1);
            resetInputs();
            updateUI();
        }
    }

    function requestClearBill() {
        if (billItemsData.length === 0) return;
        customConfirm("Clear current bill?", () => {
            billItemsData = [];
            resetInputs();
            updateUI();
        });
    }

    function updateUI() {
        billList.innerHTML = '';
        grandTotal = 0;

        if (billItemsData.length === 0) {
            billList.innerHTML = `<div style="text-align: center; padding: 20px; color: #666; font-size: 12px;" id="emptyText">Items will appear here. <br>Tap on any item to edit it.</div>`;
            grandTotalDisplay.textContent = '₹0';
            return;
        }

        billItemsData.forEach((item, index) => {
            grandTotal += item.total;
            let div = document.createElement('div');
            div.className = `bill-item ${index === editingIndex ? 'editing' : ''}`;
            div.onclick = () => editItem(index);
            div.innerHTML = `
                <div>${index + 1}</div>
                <div>${item.name}</div>
                <div>₹${item.price}</div>
                <div>${item.qty}</div>
                <div>₹${item.total.toFixed(2)}</div>
            `;
            billList.appendChild(div);
        });

        grandTotalDisplay.textContent = `₹${grandTotal.toFixed(2)}`;
        billList.scrollTop = billList.scrollHeight;
    }

    // --- Save and PDF Logic ---
    function openSaveModal() {
        if (billItemsData.length === 0) {
            customAlert("Add some items before saving.");
            return;
        }
        document.getElementById('modalCustomerName').value = '';
        document.getElementById('modalBalanceLeft').value = ''; 
        document.getElementById('saveModal').style.display = 'flex';
    }

    function closeSaveModal() {
        document.getElementById('saveModal').style.display = 'none';
    }

    function setFullPaid() {
        document.getElementById('modalBalanceLeft').value = '0';
    }

    function executeSave(isThermal) {
        let custName = document.getElementById('modalCustomerName').value.trim();
        if (!custName) {
            // Assign automatic customer name based on number of saved invoices
            custName = `Customer ${invoiceHistory.length + 1}`;
        }
        
        let balanceInput = document.getElementById('modalBalanceLeft').value;
        let balanceLeft = balanceInput === '' ? 0 : parseFloat(balanceInput);

        let invoiceData = {
            id: Date.now(),
            date: new Date().toISOString(),
            customerName: custName,
            items: [...billItemsData],
            total: grandTotal,
            balanceLeft: balanceLeft
        };

        invoiceHistory.unshift(invoiceData);
        localStorage.setItem('quickBillHistory', JSON.stringify(invoiceHistory));

        generatePDF(invoiceData, isThermal);

        closeSaveModal();
        billItemsData = [];
        resetInputs();
        updateUI();
    }

    function generatePDF(invoiceData, isThermal) {
        const printDiv = document.createElement('div');
        printDiv.style.padding = '15px';
        printDiv.style.color = '#000';
        printDiv.style.background = '#fff';
        printDiv.style.fontFamily = 'sans-serif';
        
        if (isThermal) {
            printDiv.style.width = '220px';
            printDiv.style.fontSize = '12px';
        } else {
            printDiv.style.width = '100%';
            printDiv.style.maxWidth = '800px';
        }

        let itemsHtml = invoiceData.items.map((item, index) => `
            <div style="display:flex; justify-content:space-between; margin-bottom: 5px; border-bottom: 1px dashed #ccc; padding-bottom: 5px;">
                <div style="flex:2;">${index+1}. ${item.name}</div>
                <div style="flex:1; text-align:right;">${item.price} x ${item.qty}</div>
                <div style="flex:1; text-align:right; font-weight: bold;">₹${item.total.toFixed(2)}</div>
            </div>
        `).join('');

        let balanceColor = invoiceData.balanceLeft > 0 ? '#d9534f' : '#5cb85c';

        printDiv.innerHTML = `
            <h2 style="text-align:center; margin: 0 0 10px 0;">INVOICE</h2>
            <div style="margin-bottom: 15px; font-size: 0.9em; border-bottom: 2px solid #000; padding-bottom: 10px;">
                <div><strong>Date:</strong> ${new Date(invoiceData.date).toLocaleString()}</div>
                <div><strong>Customer:</strong> ${invoiceData.customerName}</div>
            </div>
            
            <div style="font-weight:bold; margin-bottom: 5px; display:flex;">
                <div style="flex:2;">Item</div>
                <div style="flex:1; text-align:right;">Rate x Qty</div>
                <div style="flex:1; text-align:right;">Amt</div>
            </div>
            ${itemsHtml}
            
            <div style="margin-top: 15px; text-align:right; font-size: 1.1em;">
                <div><strong>Grand Total: ₹${invoiceData.total.toFixed(2)}</strong></div>
                <div style="margin-top: 8px; color: ${balanceColor}; font-size: 1em;">
                    <strong>Amount Left to Pay: ₹${invoiceData.balanceLeft.toFixed(2)}</strong>
                </div>
            </div>
            <div style="text-align:center; margin-top:20px; font-size:0.8em; color:#555;">
                Thank you for your business!
            </div>
        `;

        let opt = {
            margin:       isThermal ? 0.1 : 0.5,
            filename:     `Invoice_${invoiceData.customerName.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: isThermal ? [2.5, 4 + (invoiceData.items.length * 0.5)] : 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(printDiv).save();
    }

    // --- History Logic ---
    function openHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        
        if(invoiceHistory.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#888;">No saved invoices yet.</p>';
        } else {
            invoiceHistory.forEach((inv, index) => {
                let div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="hist-info">
                        <strong>${inv.customerName}</strong>
                        <small>${new Date(inv.date).toLocaleDateString()} | Total: ₹${inv.total} | Left: ₹${inv.balanceLeft}</small>
                    </div>
                    <div class="hist-actions">
                        <button class="btn-small btn-thermal" style="margin:0; padding: 6px; box-shadow:none;" onclick="generatePDF(invoiceHistory[${index}], true)" title="Print Thermal">🖨️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }
        document.getElementById('historyModal').style.display = 'flex';
    }

    function closeHistory() { document.getElementById('historyModal').style.display = 'none'; }
</script>
</body>
</html>
